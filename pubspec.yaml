name: personal_finance_assistant
description: "A Finance Sidekick — Personal Finance Tracking App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────
  provider: ^6.1.5

  # ── Biometric / Local Auth ──────────────────────────
  local_auth: ^3.0.1

  # ── Firebase (FCM Push Notifications) ───────────────
  firebase_core: ^4.9.0
  firebase_messaging: ^16.3.0

  # ── HTTP Client ─────────────────────────────────────
  http: ^1.4.0

  # ── Formatting ──────────────────────────────────────
  intl: ^0.20.2

  # ── Icons ───────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Google Fonts ────────────────────────────────────
  google_fonts: ^6.2.1

  # ── SMS Interceptor & Local Cache ──────────────────
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21 